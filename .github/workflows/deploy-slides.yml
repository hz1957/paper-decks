name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 首次运行时自动启用 Pages(build_type=workflow);已启用则忽略 409
      - name: Enable GitHub Pages
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.createPagesSite({
                owner: context.repo.owner,
                name: context.repo.repo,
                build_type: 'workflow',
              });
              core.info('Pages site created');
            } catch (e) {
              if (e.status === 409) {
                core.info('Pages already enabled');
              } else {
                throw e;
              }
            }

      - name: Assemble site
        run: |
          mkdir -p site
          cp Agent/large-language-monkeys/slides.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
